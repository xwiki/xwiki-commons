# The npm package repackaged by each classic webjar (i.e. with the "org.webjars" group id), by artifact id. The webjars
# with the "org.webjars.npm" group id don't need to be listed: they carry their npm package.json.
# An empty value means that there's no npm package for it (e.g. a Java library), so that no warning is logged.
bootstrap=bootstrap
bootstrap-daterangepicker=daterangepicker
bootstrap-select=bootstrap-select
bootstrap-switch=bootstrap-switch
bootstrap-tour=bootstrap-tour
Eonasdan-bootstrap-datetimepicker=eonasdan-bootstrap-datetimepicker
# The npm package of Font Awesome 5 and later (version 4 was published as "font-awesome").
font-awesome=@fortawesome/fontawesome-free
jquery=jquery
jquery-ui=jquery-ui
jquery-ui-touch-punch=jquery-ui-touch-punch
jstree=jstree
momentjs=moment
requirejs=requirejs
webjars-locator=
webjars-locator-core=
webjars-locator-lite=
